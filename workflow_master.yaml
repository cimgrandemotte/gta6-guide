project: GTA VI — The Ultimate Guide
version: 1
language: fr
current_state: S7_done_publiable
status: publiable_pending_publication
rules:
  - Rechercher des sources actuelles à chaque étape et dater les vérifications.
  - Distinguer faits officiels, informations rapportées, rumeurs et données indisponibles ; ne jamais inventer.
  - Site non officiel ; identifier les illustrations générées et respecter les droits des tiers.
  - Ne créer ni ZIP ni PDF ; images générées en JPG et audio en MP3 uniquement.
  - Maximum par réponse : 10 images et 10 fichiers audio.
  - Demander CONTINUER entre les étapes et entre chaque groupe de trois pages en S4.
  - Les actualités ne sont en temps réel que si une source et un mécanisme de mise à jour réels sont disponibles.
  - Ne pas prétendre générer de musique ou d'ambiances sonores avec un outil limité à la parole.
states:
  S0:
    name: INIT
    tasks: [Créer ce workflow, initialiser les dossiers et les fichiers racine, vérifier la structure, recherche initiale]
    checkpoint: Structure initiale vérifiée
    next: S1
  S1:
    name: RESEARCH
    depends_on: [S0]
    tasks: [Consulter les sources disponibles, documenter les sources et dates, compiler research_data.json, distinguer les informations non confirmées]
    checkpoint: Données sourcées et limites consignées
    next: S2
  S2:
    name: DESIGN_SYSTEM
    depends_on: [S1]
    tasks: [Créer les tokens et composants CSS et JS, générer jusqu'à 10 illustrations JPG, évaluer les possibilités audio]
    checkpoint: Design et ressources vérifiés
    next: S3
  S3:
    name: BUILD_CORE_PAGES
    depends_on: [S1, S2]
    tasks: [Construire accueil, navigation, pied de page et layout, intégrer les ressources disponibles]
    checkpoint: Accueil fonctionnel et responsive
    next: S4
  S4:
    name: BUILD_CONTENT_PAGES
    depends_on: [S1, S2, S3]
    tasks: [Construire les pages et sous-pages demandées par groupes de trois, signaler les données indisponibles, générer les ressources dans les limites]
    checkpoint: Liens et contenu de chaque groupe vérifiés
    next: S5
  S5:
    name: INTERACTIVE_FEATURES
    depends_on: [S3, S4]
    tasks: [Carte, filtres, recherche, quiz, comparateurs et checklist selon données fiables disponibles]
    checkpoint: Interactions clavier et données vérifiées
    next: S6
  S6:
    name: QA_AND_POLISH
    depends_on: [S5]
    tasks: [Tests responsive, liens, accessibilité, SEO et performances, corrections]
    checkpoint: Résultats et limites de tests documentés
    next: S7
  S7:
    name: FINAL_DELIVERY
    depends_on: [S6]
    tasks: [README, crédits, arborescence, instructions Vercel Netlify GitHub Pages et téléchargement]
    checkpoint: Livraison vérifiée
    next: null
